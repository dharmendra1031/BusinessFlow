name: Build staging IIS package

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows IIS package
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          .\scripts\publish-windows.ps1
      - name: Render every RDLC template
        run: python scripts/verify-rdlc.py
      - name: Verify package contents
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path 'artifacts\BusinessFlow-IIS.zip').Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $files = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('web.config', 'wwwroot/index.html', 'efbundle.exe',
                                    'ReportRenderer/ReportRenderer.exe', 'ReportRenderer/Reports/customers.rdlc')) {
              if ($required -notin $files) { throw "IIS package missing $required" }
            }
            if ('appsettings.Development.json' -in $files) {
              throw 'Development settings must not be published.'
            }
          }
          finally { $zip.Dispose() }
      - name: Record release identity
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path 'artifacts\BusinessFlow-IIS.zip').Path
          $bundlePath = (Resolve-Path 'artifacts\efbundle.exe').Path
          $manifest = [ordered]@{
            commit = '${{ github.sha }}'
            zipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
            bundleSha256 = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content artifacts\release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: staging-iis-package
          path: |
            artifacts/BusinessFlow-IIS.zip
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
