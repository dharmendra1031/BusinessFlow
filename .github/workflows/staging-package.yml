name: Build staging IIS package

on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate local staging preflight PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('check-local-staging.ps1', 'verify-billing-staging.ps1', 'verify-release.ps1')) {
            $parseErrors = $null
            $path = (Resolve-Path "scripts/$file").Path
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed: $file"
            }
          }
      - name: Reject unsafe local staging parameters
        shell: pwsh
        run: |
          $cases = @(
            @{ Source = 'master'; Stage = 'master_Stage_Safety'; Expected = 'System databases' },
            @{ Source = 'LeadManagement'; Stage = 'LeadManagement_Stage_'; Expected = 'unique suffix' },
            @{ Source = 'LeadManagement;DROP'; Stage = 'LeadManagement_Stage_Test'; Expected = 'Database names' }
          )
          foreach ($case in $cases) {
            try {
              & ./scripts/check-local-staging.ps1 -Server localhost -SourceDatabase $case.Source -StagingDatabase $case.Stage
              throw 'Preflight accepted an invalid database name.'
            }
            catch {
              if ($_.Exception.Message -notlike "*$($case.Expected)*") { throw }
            }
          }
      - name: Reject unsafe Phase 6 staging parameters
        shell: pwsh
        run: |
          $cases = @(
            @{ Database = 'master'; Expected = 'system database' },
            @{ Database = 'LeadManagement;DROP'; Expected = 'Database name' }
          )
          foreach ($case in $cases) {
            try {
              & ./scripts/verify-billing-staging.ps1 -Server localhost -Database $case.Database
              throw 'Staging verification accepted an invalid database.'
            }
            catch {
              if ($_.Exception.Message -notlike "*$($case.Expected)*") { throw }
            }
          }
          try {
            & ./scripts/verify-release.ps1 -BaseUrl 'http://localhost' -VerifyBilling
            throw 'Release verification accepted an insecure address.'
          }
          catch {
            if ($_.Exception.Message -notlike '*HTTPS*') { throw }
          }
      - name: Build Windows IIS package
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          .\scripts\publish-windows.ps1
      - name: Build Resmoh IT public website
        shell: pwsh
        run: |
          dotnet publish public-site/Resmoh.Web/Resmoh.Web.csproj -c Release -r win-x64 --self-contained false -o artifacts/resmoh-public
          if ($LASTEXITCODE -ne 0) { throw 'Public website publish failed.' }
          foreach ($required in @('web.config', 'wwwroot/index.html', 'wwwroot/start-project/index.html',
                                  'wwwroot/privacy/index.html', 'wwwroot/site.js', 'wwwroot/styles.css')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'artifacts/resmoh-public' $required))) {
              throw "Public website package is missing $required"
            }
          }
          if (Select-String -LiteralPath 'artifacts/resmoh-public/wwwroot/site.js' -Pattern 'X-Website-Signature|SigningSecret' -Quiet) {
            throw 'A website signing secret or signature mechanism must never be in browser assets.'
          }
          if (Test-Path -LiteralPath 'artifacts/resmoh-public/appsettings.Development.json') {
            throw 'Development settings must not be published in the public site.'
          }
          Compress-Archive -Path 'artifacts/resmoh-public/*' -DestinationPath 'artifacts/Resmoh-PublicSite-IIS.zip'
      - name: Render every RDLC template
        run: python scripts/verify-rdlc.py
      - name: Verify package contents
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path 'artifacts\BusinessFlow-IIS.zip').Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $files = @($zip.Entries | ForEach-Object FullName)
            foreach ($required in @('web.config', 'wwwroot/index.html', 'efbundle.exe',
                                    'ReportRenderer/ReportRenderer.exe', 'ReportRenderer/Reports/customers.rdlc')) {
              if ($required -notin $files) { throw "IIS package missing $required" }
            }
            if ('appsettings.Development.json' -in $files) {
              throw 'Development settings must not be published.'
            }
            if ('seed_kuwait_demo.sql' -in $files) {
              throw 'Demo customer data seeding scripts must not ship in staging releases.'
            }
          }
          finally { $zip.Dispose() }
      - name: Record release identity
        shell: pwsh
        run: |
          $zipPath = (Resolve-Path 'artifacts\BusinessFlow-IIS.zip').Path
          $bundlePath = (Resolve-Path 'artifacts\efbundle.exe').Path
          $manifest = [ordered]@{
            commit = '${{ github.sha }}'
            zipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
            bundleSha256 = (Get-FileHash -LiteralPath $bundlePath -Algorithm SHA256).Hash
          }
          $manifest | ConvertTo-Json | Set-Content artifacts\release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: resmoh-public-website
          path: artifacts/Resmoh-PublicSite-IIS.zip
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: staging-iis-package
          path: |
            artifacts/BusinessFlow-IIS.zip
            artifacts/release-manifest.json
          if-no-files-found: error
          retention-days: 14
