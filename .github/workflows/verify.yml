name: Verify CRM

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CRM_TestOnly_12345!"
        ports:
          - 1433:1433
    env:
      CRM_TEST_CONNECTION: "Server=localhost,1433;Database=LeadManagement_CITests;User ID=sa;Password=CRM_TestOnly_12345!;Encrypt=True;TrustServerCertificate=True"
      ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=LeadManagement_CITests;User ID=sa;Password=CRM_TestOnly_12345!;Encrypt=True;TrustServerCertificate=True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore and build
        run: |
          dotnet restore tests/BusinessFlow.Tests/BusinessFlow.Tests.csproj
          dotnet build backend/BusinessFlow.Api/BusinessFlow.Api.csproj --no-restore -c Release
      - name: Prepare SQL Server schema
        working-directory: backend/BusinessFlow.Api
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.0
          test -f Migrations/20261012050343_InitialCreate.cs
          test -f Migrations/20261019100000_AddProjectPlanning.cs
          for attempt in $(seq 1 24); do
            if dotnet ef database update; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - name: Test permissions on SQL Server
        run: dotnet test tests/BusinessFlow.Tests/BusinessFlow.Tests.csproj -c Release --no-restore
      - name: Audit .NET dependencies
        run: |
          dotnet list tests/BusinessFlow.Tests/BusinessFlow.Tests.csproj package --vulnerable --include-transitive --format json > /tmp/nuget-audit.json
          python3 scripts/verify-nuget-audit.py /tmp/nuget-audit.json
      - name: Build React
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: frontend
        env:
          Jwt__Key: "CRM_UI_TestOnly_Key_2026_Secure_Runner"
          CRM_ADMIN_EMAIL: "admin-ui@example.test"
          CRM_ADMIN_PASSWORD: "AdminUiPassword123!"
          ASPNETCORE_ENVIRONMENT: Development
          RateLimiting__LoginRequestsPerMinute: "30"
        run: npm run test:e2e
      - name: Verify committed EF model
        working-directory: backend/BusinessFlow.Api
        run: dotnet ef migrations has-pending-model-changes
